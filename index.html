<!DOCTYPE html>
<html lang="es">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Huerto y sus fotos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: left;
        }
        h1 {
            color: #007acc;
        }
        p {
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007acc;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .button:hover {
            background-color: #005999;
        }
    </style>
   </head>
     <style>
    body {
        /* Ruta de la imagen (puede ser local o un enlace de internet) */
        /* background-image: url('Omatidios.jpg'); */
           background-image: "images/Omatidios.jpg";
        
        /* Evita que la imagen se repita como un mosaico */
        background-repeat: no-repeat; 
        
        /* Centra la imagen en la pantalla */
        background-position: center; 
        
        /* Hace que la imagen cubra toda la pantalla sin deformarse */
        background-size: cover; 
        
        /* Mantiene el fondo fijo al hacer scroll (opcional) */
        background-attachment: fixed; 
    }
</style>
<body>
    <div class="container">
        <h1>Empezando</h1>
        <!--<p>Primeras pruebas <strong>index.html</strong>.</p>-->

    </div>
</body>
</html>
